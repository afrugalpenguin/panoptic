name: CI

# Four parallel jobs, each as fast as it can be. This is the only test gate: merges to main release
# straight away (release.yml), so everything a release needs to be correct is checked here, including
# a vulnerability audit of each ecosystem's dependencies.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the changelog smoke run exercises the real tag walk.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check (TS + Svelte)
        run: pnpm --filter @panoptic/desktop check
      - name: Unit tests
        run: pnpm --filter @panoptic/desktop test
      - name: Build frontend
        run: pnpm --filter @panoptic/desktop build
      # A broken generator should fail here, not in a release.
      - name: Changelog generator smoke run
        shell: pwsh
        run: ./scripts/changelog.ps1 -Head 0.0.0
      # Fails on high or critical advisories. Low and moderate ones in build tooling often have no fix
      # yet and would only block merges; Dependabot alerts still report them.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  sidecar:
    # Windows: the store uses DPAPI.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # Detailed, so skipped tests and their reasons (the opt-in integration tests) show in the log.
      - run: dotnet test apps/sidecar --logger "console;verbosity=detailed"
      - name: Audit NuGet dependencies (including transitive)
        shell: pwsh
        run: |
          $report = dotnet list apps/sidecar package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages: see the report above.' }

  sidecar-sql:
    # The SQL integration tests against a real SQL Server 2022, seeded the way scripts/dev-db.ps1 does.
    # Linux, because Windows runners cannot run the SQL Server Linux image. The sidecar targets
    # net10.0-windows, so it builds here with EnableWindowsTargeting, and the tests that go through the
    # DPAPI config store report as skipped. Cosmos stays opt-in (no emulator here).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # A docker run step rather than a service container, so the throwaway SA password is random per
      # run and masked (a service container starts before any step could generate one).
      - name: Start and seed SQL Server 2022
        run: |
          password="Pn!$(openssl rand -base64 18 | tr '/+' 'xy')"
          echo "::add-mask::$password"
          echo "PANOPTIC_TEST_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" -p 127.0.0.1:14333:1433 mcr.microsoft.com/mssql/server:2022-latest
          sqlcmd=(docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b)
          ready=
          for _ in $(seq 1 40); do
            if "${sqlcmd[@]}" -Q 'SELECT 1' > /dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          if [ -z "$ready" ]; then docker logs sql; echo "::error::SQL Server did not become ready"; exit 1; fi
          docker cp docker/seed.sql sql:/tmp/seed.sql
          "${sqlcmd[@]}" -i /tmp/seed.sql
      - name: SQL integration tests
        run: |
          set -o pipefail
          dotnet test apps/sidecar -p:EnableWindowsTargeting=true --filter "Category=SqlIntegration" --logger "console;verbosity=detailed" | tee test.log
          # Fail closed: a missing password would skip everything and still pass.
          if grep -q 'Set PANOPTIC_TEST_SQL_PASSWORD' test.log; then echo "::error::SQL tests were skipped for lack of a password"; exit 1; fi

  sidecar-pg:
    # The Postgres integration tests against PostgreSQL 17 with TLS on (the image's self-signed
    # certificate), seeded the way scripts/dev-db.ps1 does. Linux, like sidecar-sql, for the container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # Random, masked password per run, as for SQL Server. Readiness is checked over TCP: on first start
      # the image runs a temporary socket-only server while it initialises, which a socket check accepts.
      - name: Start and seed PostgreSQL 17
        run: |
          password="Pn$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "PANOPTIC_TEST_PG_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name pg -e "POSTGRES_PASSWORD=$password" -p 127.0.0.1:15432:5432 postgres:17             -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          ready=
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -h 127.0.0.1 -U postgres > /dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then docker logs pg; echo "::error::PostgreSQL did not become ready"; exit 1; fi
          docker cp docker/seed-postgres.sql pg:/tmp/seed-postgres.sql
          docker exec pg psql -q -U postgres -d postgres -f /tmp/seed-postgres.sql
      - name: Postgres integration tests
        run: |
          set -o pipefail
          dotnet test apps/sidecar -p:EnableWindowsTargeting=true --filter "Category=PgIntegration" --logger "console;verbosity=detailed" | tee test.log
          # Fail closed: a missing password would skip everything and still pass.
          if grep -q 'Set PANOPTIC_TEST_PG_PASSWORD' test.log; then echo "::error::Postgres tests were skipped for lack of a password"; exit 1; fi

  shell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: ci
      - name: Placeholders for the frontend and sidecar (built by the other jobs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist, apps/desktop/src-tauri/binaries | Out-Null
          Set-Content apps/desktop/dist/index.html '<!doctype html>'
          Set-Content apps/desktop/src-tauri/binaries/panoptic-sidecar-x86_64-pc-windows-msvc.exe ''
          Set-Content apps/desktop/src-tauri/CHANGELOG.md '# Panoptic changelog'
      - name: Check Rust shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" and "unsound" notices are reported as warnings only.
      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit
