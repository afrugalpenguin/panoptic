name: CI

# Three parallel jobs, each as fast as it can be. This is the only test gate: merges to main release
# straight away (release.yml), so everything a release needs to be correct is checked here, including
# a vulnerability audit of each ecosystem's dependencies.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the changelog smoke run exercises the real tag walk.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check (TS + Svelte)
        run: pnpm --filter @panoptic/desktop check
      - name: Unit tests
        run: pnpm --filter @panoptic/desktop test
      - name: Build frontend
        run: pnpm --filter @panoptic/desktop build
      # A broken generator should fail here, not in a release.
      - name: Changelog generator smoke run
        shell: pwsh
        run: ./scripts/changelog.ps1 -Head 0.0.0
      # Fails on high or critical advisories. Low and moderate ones in build tooling often have no fix
      # yet and would only block merges; Dependabot alerts still report them.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  sidecar:
    # Windows: the store uses DPAPI.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test apps/sidecar
      - name: Audit NuGet dependencies (including transitive)
        shell: pwsh
        run: |
          $report = dotnet list apps/sidecar package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages: see the report above.' }

  shell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: ci
      - name: Placeholders for the frontend and sidecar (built by the other jobs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist, apps/desktop/src-tauri/binaries | Out-Null
          Set-Content apps/desktop/dist/index.html '<!doctype html>'
          Set-Content apps/desktop/src-tauri/binaries/panoptic-sidecar-x86_64-pc-windows-msvc.exe ''
          Set-Content apps/desktop/src-tauri/CHANGELOG.md '# Panoptic changelog'
      - name: Check Rust shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" and "unsound" notices are reported as warnings only.
      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit
