name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin sign-off (a Signed-off-by
# trailer, from git commit -s), as CONTRIBUTING.md and ADR 0016 describe. It checks pull requests only:
# main takes nothing else. Dependabot cannot sign off, so commits it authors are exempt. The action reads
# the commits through the API, so there is no checkout.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            exempt-authors = ["49699333+dependabot[bot]@users.noreply.github.com"]
