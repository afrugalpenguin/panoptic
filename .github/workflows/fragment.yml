name: Change fragment

# feat and fix PRs must add a user-facing change fragment (docs/changelog.md, ADR 0013), and no PR may
# touch a merged fragment. Separate from CI because it also runs when a PR is retitled: in the CI
# workflow, an edit-triggered run would skip or cancel the build jobs, and a skipped required check
# counts as passing. For the same reason this job has no `if:`; it must run on every PR event.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: fragment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check change fragments
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # HEAD is the PR's test merge commit, so HEAD^1 is the base it merges onto. The event's
          # base.sha can be stale once main moves on, and would count fragments merged since then.
          set -eu
          BASE=$(git rev-parse HEAD^1)
          fail=0

          # Merged fragments are never edited, renamed, moved or deleted: git history assigns them to a
          # release. Editing changes/README.md is allowed: it is documentation, not a fragment.
          touched=$(git diff --name-status --diff-filter=MDR "$BASE" HEAD -- changes/ | awk -F'\t' '!($1 == "M" && $2 == "changes/README.md")')
          if [ -n "$touched" ]; then
            echo "::error title=Merged fragment changed::Fragments are never edited, renamed, moved or deleted after merge (changes/README.md). Add a new fragment instead. Changed:"
            echo "$touched"
            fail=1
          fi

          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- changes/ | grep -vx 'changes/README.md' || true)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # scripts/changelog.ps1 only reads changes/<name>.md; anything else would be dropped silently.
            if ! printf '%s' "$f" | grep -qE '^changes/[^/]+\.md$'; then
              echo "::error file=$f,title=Not a fragment::Fragments are changes/<short-kebab-name>.md, directly under changes/."
              fail=1
              continue
            fi
            first=$(git show "HEAD:$f" | grep -m1 -v '^[[:space:]]*$' || true)
            if [ -z "$first" ]; then
              echo "::error file=$f,title=Empty fragment::$f is empty. Write one user-facing line starting with Added:, Changed:, Fixed: or Removed:."
              fail=1
            elif ! printf '%s' "$first" | grep -qE '^(Added|Changed|Fixed|Removed): *[^[:space:]]'; then
              echo "::error file=$f,title=Bad fragment prefix::$f must start with Added:, Changed:, Fixed: or Removed: followed by the change (see changes/README.md)."
              fail=1
            fi
          done <<< "$added"

          if printf '%s' "$TITLE" | grep -qE '^(feat|fix)(\([^)]*\))?!?:'; then
            if [ -z "$added" ]; then
              echo "::error title=Change fragment missing::This feat or fix PR needs a change fragment. Add changes/<short-kebab-name>.md containing one user-facing line that starts with Added:, Changed:, Fixed: or Removed: (see changes/README.md)."
              fail=1
            fi
          else
            echo "PR title is not feat or fix; no change fragment needed."
          fi

          if [ -n "$added" ]; then
            echo "Change fragment(s):"
            echo "$added"
          fi
          exit "$fail"
