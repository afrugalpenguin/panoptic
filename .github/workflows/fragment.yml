name: Change fragment

# feat and fix PRs must add a user-facing change fragment (docs/changelog.md, ADR 0013). Separate from
# CI because it also runs when a PR is retitled: in the CI workflow, an edit-triggered run would skip or
# cancel the build jobs, and a skipped required check counts as passing.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: fragment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a change fragment on feat and fix PRs
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix)(\([^)]*\))?!?:'; then
            echo "PR title is not feat or fix; no change fragment needed."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'changes/*.md' | grep -vx 'changes/README.md' || true)
          if [ -z "$added" ]; then
            echo "::error title=Change fragment missing::This feat or fix PR needs a change fragment. Add changes/<short-kebab-name>.md containing one user-facing line that starts with Added:, Changed:, Fixed: or Removed: (see changes/README.md)."
            exit 1
          fi
          echo "Change fragment(s):"
          echo "$added"
