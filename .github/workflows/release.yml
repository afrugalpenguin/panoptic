name: Release

# Push a tag vX.Y.Z on main (after scripts/set-version.ps1 -Version X.Y.Z is merged).
# Publishes the per-user NSIS installer, its updater signature and latest.json to GitHub Releases;
# installed copies pick it up from releases/latest/download/latest.json on next launch.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match apps/desktop/package.json version $version"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Test (UI + sidecar)
        run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Panoptic ${{ github.ref_name }}
          releaseBody: Per-user installer, no elevation. Unsigned, so SmartScreen will warn on first install. Installed copies update themselves on launch.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
