name: Release

# Every merge to main ships. Version is major.minor from apps/desktop/package.json plus this
# workflow's run number as the patch, so releases never need a manual bump or tag. Bump the minor
# in package.json (scripts/set-version.ps1) to start a new series.
# Publishes the per-user installer, its updater signature, latest.json and a portable zip;
# installed copies pick the update up from releases/latest/download/latest.json on next launch.
# Tests are not re-run here: every change reached main through a PR that passed CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

# A newer merge cancels an in-progress release: it contains everything the older one would have
# shipped, so finishing the older one only delays the latest. Version numbers may skip.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog is generated from tags and the fragments added between them (ADR 0013).
          fetch-depth: 0

      - name: Set version
        shell: pwsh
        run: |
          $base = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).${{ github.run_number }}"
          ./scripts/set-version.ps1 -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      # One generator run feeds the bundled CHANGELOG.md, the release page and latest.json's notes, so they
      # always agree. The tag for this version does not exist yet; -Head covers fragments since the last one.
      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          ./scripts/changelog.ps1 -Head $env:VERSION -Out apps/desktop/src-tauri/CHANGELOG.md
          ./scripts/changelog.ps1 -Head $env:VERSION -Latest -Out release-notes.md
          $notes = (Get-Content release-notes.md -Raw).TrimEnd()
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "notes<<$delimiter`n$notes`n$delimiter" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v${{ env.VERSION }}
          releaseName: Panoptic v${{ env.VERSION }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            Two ways to run it. The setup.exe installer is per-user (no elevation) and updates itself on launch. The portable zip needs no install, so unzip it anywhere and run panoptic.exe; it tells you when a new version exists. Builds are unsigned, so SmartScreen may warn.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Attach portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "portable/Panoptic"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/panoptic.exe, apps/desktop/src-tauri/target/release/panoptic-sidecar.exe, apps/desktop/src-tauri/CHANGELOG.md $dir
          $zip = "Panoptic_${env:VERSION}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release upload "v${env:VERSION}" $zip --clobber
