name: Release

# Push a tag vX.Y.Z on main (after scripts/set-version.ps1 -Version X.Y.Z is merged).
# Publishes the per-user NSIS installer, its updater signature and latest.json to GitHub Releases;
# installed copies pick it up from releases/latest/download/latest.json on next launch.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match apps/desktop/package.json version $version"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Test (UI + sidecar)
        run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Panoptic ${{ github.ref_name }}
          releaseBody: Two ways to run it. The setup.exe installer is per-user (no elevation) and updates itself on launch. The portable zip needs no install, so unzip it anywhere and run panoptic.exe; it tells you when a new version exists. Builds are unsigned, so SmartScreen may warn.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Attach portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "portable/Panoptic"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/panoptic.exe, apps/desktop/src-tauri/target/release/panoptic-sidecar.exe $dir
          $zip = "Panoptic_${version}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release upload "${{ github.ref_name }}" $zip --clobber
