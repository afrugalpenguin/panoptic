name: Release

# Every merge to main ships. Version is major.minor from apps/desktop/package.json plus this
# workflow's run number as the patch, so releases never need a manual bump or tag. Bump the minor
# in package.json (scripts/set-version.ps1) to start a new series.
# Publishes the per-user installer, its updater signature, latest.json and a portable zip;
# installed copies pick the update up from releases/latest/download/latest.json on next launch.
# Tests are not re-run here: every change reached main through a PR that passed CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and check everything on a draft, then delete the draft instead of publishing. Allowed from any branch.
        type: boolean
        default: false

permissions:
  contents: write

# A newer merge cancels an in-progress release: it contains everything the older one would have
# shipped, so finishing the older one only delays the latest. Version numbers may skip. A cancelled
# or failed run leaves at most an untagged draft, which the updater never sees (see Publish release).
concurrency:
  # A dry run never cancels (or is cancelled by) a real release.
  group: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: true

jobs:
  release:
    # Only main is published. A dry run may come from any branch: it never publishes, and deletes its draft.
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog is generated from tags and the fragments added between them (ADR 0013).
          fetch-depth: 0

      - name: Set version
        shell: pwsh
        run: |
          $base = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).${{ github.run_number }}"
          ./scripts/set-version.ps1 -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      # One generator run feeds the bundled CHANGELOG.md, the release page and latest.json's notes, so they
      # always agree. The tag for this version does not exist yet; -Head covers fragments since the last one.
      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          ./scripts/changelog.ps1 -Head $env:VERSION -Out apps/desktop/src-tauri/CHANGELOG.md
          ./scripts/changelog.ps1 -Head $env:VERSION -Latest -Out release-notes.md
          $notes = (Get-Content release-notes.md -Raw).TrimEnd()
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "notes<<$delimiter`n$notes`n$delimiter" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v${{ env.VERSION }}
          releaseName: Panoptic v${{ env.VERSION }}${{ inputs.dry_run && ' (dry run)' || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            Two ways to run it. The setup.exe installer is per-user (no elevation) and updates itself on launch. The portable zip needs no install, so unzip it anywhere and run panoptic.exe; it tells you when a new version exists. Builds are unsigned, so SmartScreen may warn.
          # Draft until every asset is attached: releases/latest skips drafts, and the tag is only
          # created at releaseCommitish when the release is published.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      - name: Attach portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "portable/Panoptic"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/panoptic.exe, apps/desktop/src-tauri/target/release/panoptic-sidecar.exe, apps/desktop/src-tauri/CHANGELOG.md $dir
          $zip = "Panoptic_${env:VERSION}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release upload "v${env:VERSION}" $zip --clobber

      # Publish only once the installer, its .sig, latest.json and the portable zip are all on the draft and
      # latest.json matches them. If anything is wrong the check throws, the job fails and the release stays a draft.
      - name: Check release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-release-assets.ps1 -Version $env:VERSION

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${env:VERSION}" --draft=false

      # A dry run leaves nothing behind, pass or fail. Its version number is skipped, as for a cancelled release.
      - name: Delete dry-run draft
        if: ${{ always() && inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isDraft = gh release view "v${env:VERSION}" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No draft to delete"; exit 0 }
          # Never delete a published release, whatever happened above.
          if ($isDraft -ne 'true') { throw "v${env:VERSION} is not a draft; refusing to delete it" }
          gh release delete "v${env:VERSION}" --yes --cleanup-tag
