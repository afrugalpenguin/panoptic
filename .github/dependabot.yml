# Weekly dependency updates, one grouped PR per ecosystem (npm and cargo share one, below): every
# merge to main releases, so a week's updates are one merge and one release rather than one per
# package. Security updates are raised as soon as an advisory lands, independent of this schedule
# (repo setting: Dependabot alerts).
version: 2

# npm and cargo share one PR, so the Tauri JS packages (@tauri-apps/*) and Rust crates (tauri,
# tauri-plugin-*) always move together. It takes every dependency of both ("*") rather than only the
# Tauri ones: what Dependabot does with a member's dependencies outside its patterns is undocumented.
multi-ecosystem-groups:
  app:
    schedule:
      interval: weekly
      day: monday
    # Dependabot only accepts commit-message on the group, not on its member updates.
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: nuget
    directory: /apps/sidecar
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: app
    patterns: ["*"]
    # svelte-check does not run on TypeScript 7 alone (it needs 6 alongside and --tsgo). Drop this
    # once svelte-check supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    multi-ecosystem-group: app
    patterns: ["*"]
    # The WebView2 memory target (lib.rs) uses wry's own webview2-com and windows-core: a newer one is a different
    # crate whose traits don't apply to wry's types, so the build breaks (#351). They move by hand with Tauri.
    ignore:
      - dependency-name: windows-core
      - dependency-name: webview2-com
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
