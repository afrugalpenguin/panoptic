[package]
name = "panoptic"
version = "0.2.0"
description = "Native multi-environment object explorer for SQL Server and Cosmos DB"
authors = ["afrugalpenguin"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "panoptic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# No LTO and default codegen units: the shell is a thin pipe, so whole-program optimisation buys
# nothing visible but costs minutes on every release build.
[profile.release]
opt-level = 3
panic = "abort"
strip = true
